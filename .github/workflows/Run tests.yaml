name: Run tests
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'

#on:
#  pull_request:
#    types: [opened, edited, synchronize, reopened]

env:
  BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
  BUILD_SHA: ${{ github.workflow_sha }}
  BUILD_REF: ${{ github.ref_name }}

jobs:
#  debug:
#    runs-on: ubuntu-latest
#    steps:
#      - name: Print github context
#        env:
#          GITHUB_CONTEXT: ${{ toJSON(github) }}
#        run: echo "$GITHUB_CONTEXT"

  build-image:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build image image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test 1 image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}"
      - run: echo "Test 2 image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}"
    needs: [build-image]
