name: Deploy to yandex and azure dev environment
on:
  workflow_run:
    workflows: ["Run tests"]
    branches: [main]
    types:
      - completed

env:
  BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
  BUILD_SHA: ${{ github.workflow_sha }}
  BUILD_REF: ${{ github.ref_name }}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print github context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

  build-image:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build image image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}""

  deploy-ya-dev:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to dev yandex image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}""
    needs: [build-image]

  deploy-azure-dev:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to dev azure image:${BUILD_REF}-${BUILD_SHA:0:7}-${BUILD_NUMBER}"
    needs: [build-image]